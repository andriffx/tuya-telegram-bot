[project]
name = "tuya-telegram-bot"
version = "1.1.0"
description = "Kontrol perangkat Tuya (lokal) via Telegram + REST API dashboard"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["logs", "static"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# E501: pesan bot & query SQL panjang, dibaca sebagai satu baris.
# RUF001: teks Indonesia + emoji memang memakai karakter non-ASCII.
# RUF006/RUF059: dibersihkan pada fase refactor berikutnya (lihat docs/REFACTOR.md).
ignore = ["E501", "RUF001", "RUF006", "RUF059", "SIM105"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"scan_devices.py" = ["T201"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]
