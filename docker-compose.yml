services:
  tuyabot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tuyabot-withdb
    restart: unless-stopped
    environment:
      TZ: Asia/Makassar
    env_file:
      - path: .env
        required: false


    # Mount persistent data dari host (JANGAN mount .env di sini agar Docker tidak membuat folder .env otomatis)
    volumes:
      - ./logs:/app/logs             # persist logs

    # tinytuya needs host network to reach local Tuya devices
    # (remove if using Tuya Cloud API only)
    network_mode: host

    # Dashboard API (host network → langsung di port host, bukan port mapping)
    # Akses: http://<IP-server>:8080

    # Graceful shutdown
    stop_signal: SIGTERM
    stop_grace_period: 10s
