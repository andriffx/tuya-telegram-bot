services:
  tuyabot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tuyabot-withdb
    restart: unless-stopped
    # Semua konfigurasi (TZ, API_HOST, API_PORT, SQLITE_PATH, token, dst) dibaca
    # dari file .env — TIDAK ditulis di sini. Satu tempat untuk mengubah semuanya.
    # Urutan penting: file belakangan meng-override file sebelumnya.
    # .env.dockhand (dibuat Dockhand, berisi token asli) harus paling akhir.
    env_file:
      - path: .env
        required: false
      - path: .env.dockhand
        required: false

    # Mount persistent data dari host (JANGAN mount .env di sini agar Docker tidak membuat folder .env otomatis)
    # Kepemilikan direktori tidak perlu diurus manual: entrypoint memperbaiki
    # pemiliknya ke uid 10001 saat container start, lalu turun ke user non-root.
    volumes:
      - ./logs:/app/logs             # persist logs
      - ./data:/app/data             # SQLite (tuyabot.db + backup), persist antar-deploy
      - ./backup:/app/backup         # hasil `VACUUM INTO` / salinan manual

    # tinytuya butuh jalur langsung ke perangkat di LAN (via WireGuard dari VPS).
    # Host networking dipertahankan supaya rute wg0 dipakai tanpa NAT tambahan;
    # alamat bind API diatur lewat API_HOST di .env (default 127.0.0.1).
    network_mode: host

    # Container tidak boleh menulis ke filesystem-nya sendiri.
    # /app/logs, /app/data, /app/backup tetap writable karena bind-mount.
    read_only: true
    tmpfs:
      - /tmp

    cap_drop:
      - ALL
    # Minimal untuk entrypoint: chown volume (CHOWN) lalu turun ke uid 10001
    # memakai setpriv (SETUID + SETGID). Tidak ada capability lain.
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true

    # Graceful shutdown: beri waktu worker menyelesaikan siklus & menutup DB.
    stop_signal: SIGTERM
    stop_grace_period: 15s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
